name: DevSecOps Security Analysis

on:
  push:
    branches: [main, develop, devsecops/vulnerable-testing, parsing, llm-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This entire workflow will SKIP if the event is a 'push' 
# to 'llm-integration' AND the commit message contains '[test]'
if: |
  !( \
    github.event_name == 'push' && \
    github.ref == 'refs/heads/llm-integration' && \
    contains(github.event.head_commit.message, '[test]') \
  )
#Permissions pour le workflow  
permissions:  
  contents: read  
  actions: write  
  security-events: write  
  

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Static Security Analysis (SAST & SCA)

    permissions:  
      contents: read  
      actions: write  
      security-events: write  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            api/package-lock.json

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tree

      - name: Install Dependencies - Client
        working-directory: ./client
        run: npm ci --legacy-peer-deps
        continue-on-error: false

      - name: Install Dependencies - API
        working-directory: ./api
        run: npm ci --legacy-peer-deps
        continue-on-error: false

      # ===================================
      # SCA - Analyse des Dépendances
      # ===================================

      - name: SCA - NPM Audit (Client - Production)
        working-directory: ./client
        run: |
          npm audit --json > ../sca-client-production.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: SCA - NPM Audit (Client - Vulnerable)
        working-directory: ./client
        run: |
          if [ -f "package.vulnerable.json" ]; then
            cp package.json package.json.backup
            cp package.vulnerable.json package.json
            npm install --legacy-peer-deps
            npm audit --json > ../sca-client-vulnerable.json || true
            mv package.json.backup package.json
          else
            echo '{"metadata":{"vulnerabilities":{"total":0}}}' > ../sca-client-vulnerable.json
          fi
        continue-on-error: true

      - name: SCA - NPM Audit (API - Production)
        working-directory: ./api
        run: |
          npm audit --json > ../sca-api-production.json || true
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: SCA - NPM Audit (API - Vulnerable)
        working-directory: ./api
        run: |
          if [ -f "package.vulnerable.json" ]; then
            cp package.json package.json.backup
            cp package.vulnerable.json package.json
            npm install --legacy-peer-deps
            npm audit --json > ../sca-api-vulnerable.json || true
            mv package.json.backup package.json
          else
            echo '{"metadata":{"vulnerabilities":{"total":0}}}' > ../sca-api-vulnerable.json
          fi
        continue-on-error: true

      - name: SCA - OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        timeout-minutes: 30
        with:
          project: 'ChronoGaz'
          path: '.'
          format: 'JSON,HTML'
          out: 'dependency-check-reports'
        continue-on-error: true

      - name: Upload SCA Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: |
            sca-client-production.json
            sca-client-vulnerable.json
            sca-api-production.json
            sca-api-vulnerable.json
            dependency-check-reports/
          retention-days: 30
          if-no-files-found: warn

      # ===================================
      # SAST - Analyse Statique du Code
      # ===================================

      - name: SAST - ESLint Security Plugin
        run: |
          set -euo pipefail
          
          TEMP_INSTALL_DIR="/tmp/eslint-tools"
          mkdir -p "$TEMP_INSTALL_DIR"
          cd "$TEMP_INSTALL_DIR"
          
          echo "🔧 Installation ESLint & plugins..."
          npm init -y > /dev/null 2>&1
          npm install eslint@8.57.0 eslint-plugin-security eslint-plugin-no-secrets --force > /dev/null 2>&1
          
          export PATH="$TEMP_INSTALL_DIR/node_modules/.bin:$PATH"
          export NODE_PATH="$TEMP_INSTALL_DIR/node_modules${NODE_PATH:+:$NODE_PATH}"
          
          cd $GITHUB_WORKSPACE
          
          # Créer config ESLint avec nom unique
          printf '{"env":{"browser":true,"es2021":true,"node":true},"parserOptions":{"ecmaVersion":2021,"sourceType":"module","ecmaFeatures":{"jsx":true}},"plugins":["security","no-secrets"],"rules":{"no-secrets/no-secrets":"warn","security/detect-eval-with-expression":"error","security/detect-non-literal-require":"warn","security/detect-non-literal-regexp":"warn","security/detect-non-literal-fs-filename":"warn","security/detect-unsafe-regex":"error","security/detect-buffer-noassert":"warn","security/detect-child-process":"warn","security/detect-disable-mustache-escape":"warn","security/detect-no-csrf-before-method-override":"warn","security/detect-possible-timing-attacks":"warn","security/detect-pseudoRandomBytes":"warn","security/detect-object-injection":"warn"}}' > .eslintrc.security.json
          
          echo "📄 Config de sécurité générée"
          
          echo '[]' > sast-eslint-client.json
          echo '[]' > sast-eslint-api.json
          
          # Scan client avec --no-eslintrc pour ignorer les configs existantes
          echo "🔍 Scan client/src..."
          if [ -d "client/src" ]; then
            find client/src -type f \( -name "*.js" -o -name "*.jsx" \) > /tmp/client-files.txt
            if [ -s /tmp/client-files.txt ]; then
              xargs -a /tmp/client-files.txt eslint \
                --no-eslintrc \
                --config .eslintrc.security.json \
                --resolve-plugins-relative-to "$TEMP_INSTALL_DIR" \
                --format json \
                -o sast-eslint-client.json 2>&1 || true
            fi
          fi
          
          # Scan api avec --no-eslintrc
          echo "🔍 Scan api/src..."
          if [ -d "api/src" ]; then
            find api/src -type f -name "*.js" > /tmp/api-files.txt
            if [ -s /tmp/api-files.txt ]; then
              xargs -a /tmp/api-files.txt eslint \
                --no-eslintrc \
                --config .eslintrc.security.json \
                --resolve-plugins-relative-to "$TEMP_INSTALL_DIR" \
                --format json \
                -o sast-eslint-api.json 2>&1 || true
            fi
          fi
          
          # Valider JSON et afficher résumé
          for f in sast-eslint-client.json sast-eslint-api.json; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "⚠️  JSON invalide pour $f, réinitialisation"
              echo '[]' > "$f"
            else
              ISSUES=$(jq 'length' "$f")
              echo "✓ $f : $ISSUES fichiers analysés"
            fi
          done
          
          echo ""
          echo "✅ Rapports SAST générés:"
          ls -lh sast-eslint-*.json
          
          # Afficher un résumé des problèmes trouvés
          echo ""
          echo "📊 Résumé des vulnérabilités détectées:"
          for f in sast-eslint-client.json sast-eslint-api.json; do
            if [ -f "$f" ]; then
              TOTAL_ISSUES=$(jq '[.[] | .messages | length] | add // 0' "$f")
              ERROR_COUNT=$(jq '[.[] | .messages[] | select(.severity == 2)] | length' "$f")
              WARN_COUNT=$(jq '[.[] | .messages[] | select(.severity == 1)] | length' "$f")
              echo "  $f: $TOTAL_ISSUES issues ($ERROR_COUNT errors, $WARN_COUNT warnings)"
            fi
          done
        continue-on-error: true

      - name: Upload SAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            sast-eslint-client.json
            sast-eslint-api.json
          retention-days: 30
          if-no-files-found: warn

  # ====================================================================  
  # Job DAST - Dynamic Application Security Testing  
  # ====================================================================  
    
  dast-scan:    
    runs-on: ubuntu-latest    
    name: Dynamic Security Analysis (DAST)    
    needs: security-scan    
    timeout-minutes: 20    
  
    permissions:    
      contents: read    
      actions: write    
      security-events: write  
      id-token: write  
        
    steps:    
      - name: Checkout code    
        uses: actions/checkout@v4    
          
      - name: Verify Target Accessibility    
        run: |    
          echo "Testing target: ${{ secrets.ZAP_TARGET_URL }}"    
          if curl -f -s -o /dev/null "${{ secrets.ZAP_TARGET_URL }}/api/health"; then    
            echo "✅ Target is accessible"    
          else    
            echo "⚠️ Warning: Target may not be accessible"    
          fi    
        continue-on-error: true    
          
      - name: DAST - OWASP ZAP Baseline Scan    
        uses: zaproxy/action-baseline@v0.10.0    
        with:    
          target: ${{ secrets.ZAP_TARGET_URL }}    
          rules_file_name: '.zap/rules.tsv'    
          cmd_options: '-a'    
          allow_issue_writing: false  
          artifact_name: 'zap-scan-results'
        continue-on-error: true    
          
      - name: Upload DAST Reports    
        uses: actions/upload-artifact@v4    
        if: always()    
        with:    
          name: dast-reports    
          path: |    
            report_html.html    
            report_json.json    
            report_md.md    
          retention-days: 30    
          if-no-files-found: warn

  # ====================================================================
  # Job PARSING - Parse SAST Reports
  # ====================================================================
  
  parse-sast-reports:
    runs-on: ubuntu-latest
    name: Parse SAST Reports
    needs: [security-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download SAST Reports
        uses: actions/download-artifact@v4
        with:
          name: sast-reports
          path: ./reports/
        continue-on-error: true
      
      - name: Run SAST Parser
        run: |
          echo "🔍 Parsing SAST Reports..."
          python3 scripts/parsing/sast_parser.py \
            -i ./reports/ \
            -o ./unified_sast_report.json
        continue-on-error: true
      
      - name: Display Summary
        if: always()
        run: |
          if [ -f ./unified_sast_report.json ]; then
            python3 << 'EOF'
          import json
          with open('./unified_sast_report.json') as f:
              data = json.load(f)
              summary = data['summary']
              print(f"\n✅ Parsing Complete!")
              print(f"   Vulnerabilities: {summary['total_vulnerabilities']}")
              print(f"   Risk Score: {summary['risk_score']}/100")
          EOF
          fi
      
      - name: Upload Unified Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-sast-report
          path: unified_sast_report.json
          retention-days: 30


  # ====================================================================
  # Job PARSING SCA - Parse SCA Reports
  # ====================================================================
  
  parse-sca-reports:
    runs-on: ubuntu-latest
    name: Parse SCA Reports
    needs: [security-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download SCA Reports
        uses: actions/download-artifact@v4
        with:
          name: sca-reports
          path: ./reports/
        continue-on-error: true
      
      - name: Run SCA Parser
        run: |
          echo "🔍 Parsing SCA Reports..."
          python3 scripts/parsing/sca_parser.py \
            -i ./reports/ \
            -o ./unified_sca_report.json
        continue-on-error: true
      
      - name: Display Summary
        if: always()
        run: |
          if [ -f ./unified_sca_report.json ]; then
            python3 << 'EOF'
          import json
          with open('./unified_sca_report.json') as f:
              data = json.load(f)
              summary = data['summary']
              print(f"\n✅ SCA Parsing Complete!")
              print(f"   Vulnerabilities: {summary['total_vulnerabilities']}")
              print(f"   Vulnerable Packages: {summary['vulnerable_packages']}")
              print(f"   Risk Score: {summary['risk_score']}/100")
          EOF
          fi
      
      - name: Upload Unified Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-sca-report
          path: unified_sca_report.json
          retention-days: 30

  # ====================================================================
  # Job PARSING DAST - Parse DAST Reports
  # ====================================================================
  
  parse-dast-reports:
    runs-on: ubuntu-latest
    name: Parse DAST Reports
    needs: [dast-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Download DAST Reports
        uses: actions/download-artifact@v4
        with:
          name: dast-reports
          path: ./reports/
        continue-on-error: true
      
      - name: Run DAST Parser
        run: |
          echo "🔍 Parsing DAST Reports..."
          python3 scripts/parsing/dast_parser.py \
            -i ./reports/ \
            -o ./unified_dast_report.json
        continue-on-error: true
      
      - name: Display Summary
        if: always()
        run: |
          if [ -f ./unified_dast_report.json ]; then
            python3 << 'EOF'
          import json
          with open('./unified_dast_report.json') as f:
              data = json.load(f)
              summary = data['summary']
              print(f"\n✅ DAST Parsing Complete!")
              print(f"   Alerts: {summary['total_alerts']}")
              print(f"   Instances: {summary['total_instances']}")
              print(f"   Risk Score: {summary['risk_score']}/100")
          EOF
          fi
      
      - name: Upload Unified Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-dast-report
          path: unified_dast_report.json
          retention-days: 30
  # ====================================================================
  # Job LLM - Generate Security Policies
  # ====================================================================
  
  generate-policies:
    runs-on: ubuntu-latest
    name: Generate Security Policies (LLM)
    
    # 1. ADD DEPENDENCIES: 
    # This ensures the job waits for all parsing jobs to finish.
    needs: [parse-sast-reports, parse-sca-reports, parse-dast-reports]
    
    # Run even if previous jobs have non-failing errors (due to continue-on-error: true)
    if: always() 
    
    permissions:
      contents: read  # To checkout the policy_generator.py script
      actions: write  # To upload the generated-policies artifact
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python Dependencies
        run: |
          pip install requests openai nltk rouge-score
      
      # 2. DOWNLOAD ARTIFACTS:
      # Download the unified reports generated by the parsing jobs.
      - name: Download Unified SAST Report
        uses: actions/download-artifact@v4
        with:
          name: unified-sast-report
          path: ./reports/ # Download to a 'reports' directory
        continue-on-error: true # Don't fail if the artifact is missing

      - name: Download Unified SCA Report
        uses: actions/download-artifact@v4
        with:
          name: unified-sca-report
          path: ./reports/
        continue-on-error: true

      - name: Download Unified DAST Report
        uses: actions/download-artifact@v4
        with:
          name: unified-dast-report
          path: ./reports/
        continue-on-error: true
        
      - name: Verify Downloaded Reports
        run: |
          echo "Listing downloaded reports in ./reports/"
          ls -lR ./reports/
          
          # Create placeholder files if they don't exist
          # This prevents the python script from failing if a report is missing
          mkdir -p ./reports
          touch ./reports/unified_sast_report.json
          touch ./reports/unified_sca_report.json
          touch ./reports/unified_dast_report.json
          
          # Ensure output directory exists
          mkdir -p ./generated-policies/

      # 3. UPDATE SCRIPT PATHS:
      # Point the python script to the newly downloaded reports.
      - name: Run LLM Policy Generation Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          echo "🔍 Starting LLM Policy Generation..."
          python3 scripts/llm-integration/policy_generator.py \
            --sast-report ./reports/unified_sast_report.json \
            --sca-report ./reports/unified_sca_report.json \
            --dast-report ./reports/unified_dast_report.json \
            --output-dir ./generated-policies/
          
          echo "✅ Policy generation complete. Files created:"
          ls -l ./generated-policies/
        continue-on-error: true # Don't fail the whole pipeline if LLM fails

      - name: Upload Generated Policies
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-policies
          path: ./generated-policies/
          retention-days: 30
          if-no-files-found: warn # Use 'warn' so it doesn't fail if no policies are made